name: stratus

services:
  backend:
    build:
      context: .
      args:
        VERSION: ${STRATUS_VERSION:-dev}
    image: stratus-backend:${STRATUS_VERSION:-dev}
    restart: unless-stopped

    # Runs as the host user that owns the data directory. `make up` fills these
    # in from `id -u` / `id -g`; override in .env for a dedicated service user.
    user: "${STRATUS_UID:-1000}:${STRATUS_GID:-1000}"

    ports:
      - "${STRATUS_PORT:-8080}:8080"
    environment:
      STRATUS_ADDR: ":8080"
      STRATUS_DATA_DIR: "/data"
      STRATUS_LOG_LEVEL: "${STRATUS_LOG_LEVEL:-info}"

    # Photos, music and the SQLite database live here. Point this at real storage
    # (e.g. /srv/stratus) once there is something worth keeping.
    volumes:
      - "${STRATUS_DATA_PATH:-./data}:/data"

    healthcheck:
      test: ["CMD", "/usr/local/bin/stratus", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
