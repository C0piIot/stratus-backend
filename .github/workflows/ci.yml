name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing, and the repo is private so minutes are
# metered.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never let the go command download a different toolchain: that would mask the
  # very drift the pinned version exists to prevent.
  GOTOOLCHAIN: local
  # CI has a native toolchain from setup-go. Setting this explicitly means a
  # broken setup-go step fails loudly instead of silently falling back to Docker
  # and merely getting slower.
  GO_MODE: native

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          # go.mod is the single source of truth for the Go version; the
          # Makefile derives it from there too.
          go-version-file: go.mod
          check-latest: false

      # The pinned version lives in one file that both this workflow and
      # `make lint` read, so the two can never drift.
      - name: Resolve pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go.mod is tidy
        run: make tidy-check

      - name: govulncheck
        run: make vuln

      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12 -color

      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # The runner has a C toolchain, so -race needs no container here. The
      # shipped artifact stays CGO_ENABLED=0; see the Dockerfile.
      - name: test -race
        run: make test-race

      # The conformance suite against a real S3 API. Docker is already on the
      # runner, and a `services:` block could not pass `server /data` to the
      # image anyway.
      - name: S3 conformance against MinIO
        run: make test-s3

      - name: metadata conformance against PostgreSQL
        run: make test-db

      - name: coverage
        run: make cover

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # git describe needs tags for a meaningful version string.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4.3.0

      # Asserts the deployment properties unit tests cannot reach: static
      # binary, no shell, non-root, hardened runtime, and the data-directory
      # failure matrix.
      - name: smoke tests
        run: make smoke

      # Self-hosters run arm64 (Raspberry Pi and friends). The build stage
      # cross-compiles, so this needs no QEMU. Build only: publishing happens
      # on tags.
      - name: multi-arch build
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$(git describe --tags --always --dirty)" \
            .
