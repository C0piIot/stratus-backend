name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing, and it would still be building an image
# nobody is going to pull.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never let the go command download a different toolchain: that would mask the
  # very drift the pinned version exists to prevent.
  GOTOOLCHAIN: local
  # CI has a native toolchain from setup-go. Setting this explicitly means a
  # broken setup-go step fails loudly instead of silently falling back to Docker
  # and merely getting slower.
  GO_MODE: native

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          # go.mod is the single source of truth for the Go version; the
          # Makefile derives it from there too.
          go-version-file: go.mod
          check-latest: false

      # The pinned version lives in one file that both this workflow and
      # `make lint` read, so the two can never drift.
      - name: Resolve pinned golangci-lint version
        id: golangci
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go.mod is tidy
        run: make tidy-check

      - name: govulncheck
        run: make vuln

      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12 -color

      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: build/ffprobe/Dockerfile

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      # The runner has a C toolchain, so -race needs no container here. The
      # shipped artifact stays CGO_ENABLED=0; see the Dockerfile.
      - name: test -race
        run: make test-race

      # The conformance suite against a real S3 API. Docker is already on the
      # runner, and a `services:` block could not pass `server /data` to the
      # image anyway.
      - name: S3 conformance against Garage
        run: make test-s3

      - name: metadata conformance against PostgreSQL
        run: make test-db

      - name: coverage
        run: make cover

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # git describe needs tags for a meaningful version string.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4.3.0

      # Asserts the deployment properties unit tests cannot reach: static
      # binary, no shell, non-root, hardened runtime, and the data-directory
      # failure matrix.
      - name: smoke tests
        run: make smoke

      # The same assertions again, against a twin of the image built with
      # `go build -cover`. It is what measures cmd/stratus and the startup
      # paths, which no unit test can import.
      - name: smoke tests with coverage
        run: make smoke-cover

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-smoke
          path: coverage-smoke.out
          retention-days: 7

      # Self-hosters run arm64 (Raspberry Pi and friends). The build stage
      # cross-compiles, so this needs no QEMU. Build only here: the publish job
      # below does it again with --push, and only once this one has passed.
      - name: multi-arch build
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$(git describe --tags --match "v*" --always --dirty)" \
            .

  # Publishes only after lint, test and the container assertions have passed:
  # an image that failed the gate is worse than no image at all.
  publish:
    name: publish
    needs: [lint, test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      # What was pushed, by digest. The deploy below takes this rather than the
      # :main tag, so what runs is the thing this job built and not whatever
      # that tag points at by the time it is pulled.
      image: ${{ steps.pushed.outputs.ref }}
      # The string the binary prints as its version and the UI shows in its
      # footer. Computed once, here, so that what is deployed, what is stamped
      # into the binary and what the test instance uses as a password cannot
      # drift apart.
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # git describe needs tags for a meaningful version string.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/stratus-backend" >> "$GITHUB_OUTPUT"

      # No QEMU: the Go stage cross-compiles and the two stages it copies from
      # -- distroless and our ffprobe -- are both multi-arch images that are
      # only ever copied out of, never run.
      - name: version
        id: version
        run: echo "value=$(git describe --tags --match 'v*' --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: build and push :main
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${{ steps.version.outputs.value }}" \
            --tag "${{ steps.img.outputs.image }}:main" \
            --metadata-file meta.json \
            --push .

      - name: the digest it pushed
        id: pushed
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: echo "ref=$IMAGE@$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"

  # A throwaway instance kept on the last green main, and nothing else. It does
  # nothing in a fork or in any repo where FLY_APP is unset, which is what keeps
  # this from being a deploy recipe pretending to be one -- see issue #13.
  #
  # fly.toml carries the machine, so changing its size or its settings is a
  # commit rather than somebody's shell history; --app takes the name from a
  # variable so a fork deploys the same configuration to its own instance. The
  # image is the digest publish just pushed, not the tag it pushed it under.
  deploy:
    name: deploy
    needs: publish
    if: vars.FLY_APP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@v1.4

      # The password is the version in the footer, which is the short sha of the
      # commit being deployed. There is no secret to keep and it rotates by
      # itself; what it costs is said in the README, out loud: this repository is
      # public, so that instance is too, and every deploy logs every client out.
      #
      # --stage does not restart anything: the secret is applied by the deploy
      # below, which was going to restart the machine anyway.
      - name: stage the instance's password
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set --stage --app "${{ vars.FLY_APP }}" \
            STRATUS_PASSWORD="${{ needs.publish.outputs.version }}"

      - name: deploy what publish pushed
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app "${{ vars.FLY_APP }}" \
            --image "${{ needs.publish.outputs.image }}" \
            --ha=false --yes \
            --wait-timeout 5m

      # The machine keeps nothing, so every deploy lands on an empty tree. This
      # fills it with the demo bundle and then asks the server what it did with
      # it -- the only check this project runs against something deployed.
      - name: seed the demo media
        run: |
          # The username is not a secret either, and lives in fly.toml, which is
          # what the instance is actually configured from.
          STRATUS_USERNAME="$(sed -n 's/^ *STRATUS_USERNAME *= *"\(.*\)"/\1/p' fly.toml)" \
          STRATUS_PASSWORD="${{ needs.publish.outputs.version }}" \
            ./scripts/seed-demo.sh "https://${{ vars.FLY_APP }}.fly.dev"
