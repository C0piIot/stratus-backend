# Publishes the trimmed ffprobe the server image copies in.
#
# Separate from ci.yml on purpose: this compiles C, and doing it in the server
# Dockerfile would put an emulated cross-architecture build on every commit.
# Here it runs only when the recipe or the FFmpeg version changes, which is
# roughly never, and the server build stays one COPY.
name: ffprobe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build/ffprobe/**', '.github/workflows/ffprobe.yml']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # arm64 is emulated, so this is slow. It is also rare, and the alternative
    # -- cross-compiling FFmpeg -- fights the toolchain for every library.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      # The tag is the FFmpeg version, read from the recipe so the two cannot
      # disagree about what was published.
      - name: version
        id: v
        run: |
          version="$(sed -n 's/^ARG FFMPEG_VERSION=//p' build/ffprobe/Dockerfile)"
          [ -n "$version" ] || { echo "no FFMPEG_VERSION in the Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4.0.0
      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/${{ github.repository_owner }}/stratus-ffprobe:${{ steps.v.outputs.version }}" \
            --push build/ffprobe
