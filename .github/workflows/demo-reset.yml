name: demo reset

# The test instance is open on purpose -- its password is the version in its
# footer, which anybody can read off this repository -- so what keeps it from
# being worth abusing is that it forgets everything, every hour.
#
# scripts/demo-reset.sh is the whole of it: it destroys the machine and the
# volume under it, which is the only thing that empties the disk (see fly.toml),
# deploys the same image onto a new one, checks the tree is empty and seeds the
# demo media again. It leaves the demo down for the length of a deploy, which is
# the honest price of a wipe that actually wipes, and it is a demo.
#
# Nothing here upgrades anything; the pipeline in ci.yml is what deploys new
# code, through the same script.
#
# GitHub's schedule is best effort and runs late under load, and it stops
# altogether after sixty days with no push to the repository. Neither matters
# for a demo, and both are why this can be run by hand as well.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One at a time, and never cancelled halfway: a reset that stopped between the
# deploy and the seeding would leave the demo empty until the next hour.
concurrency:
  group: demo-reset
  cancel-in-progress: false

env:
  FLY_APP: ${{ vars.FLY_APP }}

jobs:
  reset:
    name: reset
    # Nothing to reset where no instance is configured, which is every fork.
    if: vars.FLY_APP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@v1.4

      - name: what it is running
        id: running
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Read off the machine rather than worked out from git: this job
          # resets whatever is deployed, which is not necessarily this commit,
          # and putting a different build back would make it a deploy.
          image="$(flyctl image show --app "$FLY_APP" --json 2>/dev/null |
            jq -r '.[0] | "\(.Registry)/\(.Repository)@\(.Digest)"' || true)"
          case "$image" in
          */*@sha256:*) ;;
          *)
            # No machine to read it off, which is what a reset that failed
            # halfway leaves behind. fly.toml names what CI publishes, so this
            # recovers the instance rather than needing somebody to notice.
            image=""
            echo "no image on the app; falling back to the one in fly.toml"
            ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: empty it and seed the demo media again
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: ./scripts/demo-reset.sh "$FLY_APP" "${{ steps.running.outputs.image }}"
