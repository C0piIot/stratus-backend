# Fly.io: a Stratus of your own, which is what `fly launch` reads.
#
#   fly launch --from https://github.com/stratus-private-cloud/stratus-backend --copy-config \
#     --ha=false --secret STRATUS_USERNAME=you --secret STRATUS_PASSWORD='choose one'
#
# --copy-config is not optional: without it launch ignores this file, scans the
# clone, builds the Dockerfile and makes a 1 GB machine with no volume.
#
# doc/deploy/fly.md is the page that explains it. The demo is not this file:
# it is deploy/demo/fly.toml, and it is thrown away every hour.
#
# No app name on purpose: launch asks for one, or takes --name, and writes it
# into its own copy of this file.

primary_region = "cdg"

# 256 MB is not enough for the first thumbnails while the indexer is still
# reading: the kernel kills the server mid-request and the proxy answers 502.
# Swap takes the spike more slowly instead.
swap_size_mb = 512

[build]
  image = "ghcr.io/stratus-private-cloud/stratus-backend:main"

[env]
  STRATUS_ADDR = ":8080"
  STRATUS_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  # Fly terminates TLS and forwards the scheme, which is what makes the
  # session cookie Secure.
  force_https = true
  # Nobody is watching it most of the time, so it sleeps and the first request
  # wakes it. Fly will not suspend a machine with swap, so: stop.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

# launch creates this volume; a later deploy only mounts it. 1 GB is the
# smallest Fly sells, and a volume can be extended but never shrunk, so size it
# for the library rather than for the first week.
[mounts]
  source = "stratus_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
