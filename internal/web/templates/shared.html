{{define "content" -}}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="h4">Link to {{.Name}}</h1>
    <div class="card card-body">
      <label class="form-label" for="link">Anybody with this can open it</label>
      <div class="input-group">
        <input class="form-control font-monospace" id="link" type="text"
               value="{{.Link}}" readonly autofocus>
        {{/* Hidden until the script shows it, so a browser with no JavaScript
             gets the field alone rather than a button that does nothing. */}}
        <button class="btn btn-outline-secondary d-none" type="button"
                data-copies="link">Copy</button>
      </div>

      <p class="text-body-secondary small mt-3 mb-0">
        {{if .Expires}}It stops working on {{.Expires}}.{{else}}It works until
        the password changes.{{end}}
      </p>

      <div class="d-flex gap-2 mt-3">
        <a class="btn btn-outline-secondary" href="{{.Back}}">Done</a>
      </div>
    </div>
  </div>
</div>
{{- end}}
