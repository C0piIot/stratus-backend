{{define "content" -}}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="h4">Delete for good</h1>
    <div class="card card-body">
      <p class="mb-3">
        This deletion and everything in it will be destroyed now, along with
        the pictures made from it. <strong>This cannot be undone</strong>:
        there is nothing behind the trash.
      </p>
      <div class="d-flex gap-2">
        <form method="post" action="{{.Action}}">
          <button class="btn btn-danger" type="submit">Delete for good</button>
        </form>
        <a class="btn btn-outline-secondary" href="{{.Back}}">Cancel</a>
      </div>
    </div>
  </div>
</div>
{{- end}}
