{{define "content" -}}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="h4">Rename {{if .IsDir}}folder{{else}}file{{end}}</h1>
    <form method="post" action="{{.Action}}" class="card card-body">
      <label class="form-label" for="name">New name for <code>{{.Name}}</code></label>
      <input class="form-control" id="name" name="name" type="text"
             value="{{.Name}}" autocomplete="off" required autofocus>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary" type="submit">Rename</button>
        <a class="btn btn-outline-secondary" href="{{.Back}}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{{- end}}
