# golangci-lint v2 configuration. The version is pinned in .golangci-version,
# which both the Makefile and CI read, so there is a single source of truth.
version: "2"

run:
  timeout: 5m

linters:
  # "standard" is errcheck, govet, ineffassign, staticcheck, unused. Not "all":
  # that set includes dupl, lll, wsl and friends, which fight the author more
  # than they help. Everything below was chosen for what this project does.
  default: standard
  enable:
    # Architecture rules from CLAUDE.md, enforced rather than documented.
    - depguard
    # HTTP handlers and clients, on every protocol surface.
    - bodyclose
    - noctx
    # Background work is goroutines in-process, so context plumbing matters.
    - contextcheck
    # Errors cross driver boundaries as shared sentinels.
    - errorlint
    - nilerr
    # Hand-written SQL with no ORM: leaked Rows is the classic bug.
    - sqlclosecheck
    - rowserrcheck
    # Serving user-controlled paths from disk storage.
    - gosec
    # Streaming hot path.
    - durationcheck
    - makezero
    - perfsprint
    - prealloc
    - wastedassign
    # Hygiene.
    - misspell
    - revive
    - usetesting

  settings:
    depguard:
      rules:
        # CLAUDE.md: "no driver-specific SQL or types leak outside the driver
        # package". These rules make a leak a build failure instead of a note in
        # a markdown file. The target packages do not exist yet; the rules are
        # in place so the first violation is caught the day it is written.
        db-driver:
          list-mode: lax
          files:
            - "!**/internal/db/sqlite/**"
          deny:
            - pkg: modernc.org/sqlite
              desc: only internal/db/sqlite may import the SQLite driver
              # (a mysql driver gets its own rule if it ever lands)
        db-driver-postgres:
          list-mode: lax
          files:
            - "!**/internal/db/postgres/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: only internal/db/postgres may import the PostgreSQL driver
        storage-backend:
          list-mode: lax
          files:
            - "!**/internal/storage/s3/**"
          deny:
            - pkg: github.com/minio/minio-go
              desc: only internal/storage/s3 may import the S3 client
        # Architecture boundaries from CLAUDE.md. The packages below mostly do
        # not exist yet: the rules are in place so the first violation fails the
        # build the day it is written, rather than being found in a review.
        #
        # Inbound protocol adapters must not import each other. A shared helper
        # belongs in a feature package, not in a sibling adapter.
        # One rule per adapter rather than one shared rule: a single rule whose
        # file list and deny list both name every adapter also forbids a package
        # from importing itself, which is what its own tests do.
        no-cross-protocol-dav:
          list-mode: lax
          files:
            - "**/internal/dav/**"
          deny:
            - pkg: github.com/C0piIot/stratus-backend/internal/subsonic$
              desc: inbound adapters must not import each other
            - pkg: github.com/C0piIot/stratus-backend/internal/web$
              desc: inbound adapters must not import each other
        no-cross-protocol-subsonic:
          list-mode: lax
          files:
            - "**/internal/subsonic/**"
          deny:
            - pkg: github.com/C0piIot/stratus-backend/internal/dav$
              desc: inbound adapters must not import each other
            - pkg: github.com/C0piIot/stratus-backend/internal/web$
              desc: inbound adapters must not import each other
        no-cross-protocol-web:
          list-mode: lax
          files:
            - "**/internal/web/**"
          deny:
            - pkg: github.com/C0piIot/stratus-backend/internal/dav$
              desc: inbound adapters must not import each other
            - pkg: github.com/C0piIot/stratus-backend/internal/subsonic$
              desc: inbound adapters must not import each other
        # Ports, features and support packages sit below the adapters: the
        # dependency only ever points inwards. Nothing imports the composition
        # root.
        no-inbound-from-core:
          list-mode: lax
          files:
            - "**/internal/storage/**"
            - "**/internal/db/**"
            - "**/internal/files/**"
            - "**/internal/calendar/**"
            - "**/internal/music/**"
            - "**/internal/media/**"
            - "**/internal/auth/**"
            - "**/internal/config/**"
          deny:
            - pkg: github.com/C0piIot/stratus-backend/internal/dav$
              desc: dependencies point inwards; a port or feature must not import a protocol adapter
            - pkg: github.com/C0piIot/stratus-backend/internal/subsonic$
              desc: dependencies point inwards; a port or feature must not import a protocol adapter
            - pkg: github.com/C0piIot/stratus-backend/internal/web$
              desc: dependencies point inwards; a port or feature must not import a protocol adapter
            - pkg: github.com/C0piIot/stratus-backend/internal/app$
              desc: nothing imports the composition root
        # The WebDAV library belongs to the adapter that speaks WebDAV, for the
        # same reason a database driver belongs to its own package: the day a
        # feature imports it, the protocol has leaked inwards.
        dav-library:
          list-mode: lax
          files:
            - "!**/internal/dav/**"
          deny:
            - pkg: github.com/emersion/go-webdav
              desc: only internal/dav may import the WebDAV library

        # The two seams must not know about each other. A blob key is a plain
        # string in a database row precisely so that neither has to, which is
        # what lets an import adopt somebody else's bucket without moving bytes.
        # Nothing enforced this before: the rules above keep drivers in their
        # package and adapters out of the core, but said nothing about a port
        # importing the other port.
        no-cross-seam-from-db:
          list-mode: lax
          files:
            - "**/internal/db/**"
          deny:
            - pkg: github.com/C0piIot/stratus-backend/internal/storage
              desc: the metadata seam must not know about the blob seam
        no-cross-seam-from-storage:
          list-mode: lax
          files:
            - "**/internal/storage/**"
          deny:
            - pkg: github.com/C0piIot/stratus-backend/internal/db
              desc: the blob seam must not know about the metadata seam

        # CLAUDE.md: minimal dependencies, stdlib first, no web framework.
        minimal-deps:
          list-mode: lax
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: use net/http from the stdlib, no web framework
            - pkg: github.com/gorilla/mux
              desc: use net/http from the stdlib, no router library
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog from the stdlib
            - pkg: go.uber.org/zap
              desc: use log/slog from the stdlib
            - pkg: github.com/pkg/errors
              desc: use errors from the stdlib
            - pkg: math/rand$
              desc: use math/rand/v2

    govet:
      enable-all: true
      disable:
        # Field alignment is a micro-optimisation that hurts readability.
        - fieldalignment

    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-return
        - name: context-as-argument
        - name: indent-error-flow
        - name: unreachable-code

  exclusions:
    rules:
      # Test code legitimately builds paths from fixtures and does not need
      # preallocation discipline.
      - path: _test\.go
        linters:
          - gosec
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
